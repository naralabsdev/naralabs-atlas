name: naralabs-atlas

x-atlas-env: &atlas-env
  SERVICE_NAME: naralabs-atlas
  ENV: dev
  LOG_LEVEL: info
  LOG_JSON: "true"
  NETWORK: testnet
  RPC_URL: https://soroban-testnet.stellar.org
  HORIZON_URL: https://horizon-testnet.stellar.org
  POSTGRES_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
  CLICKHOUSE_URL: clickhouse://atlas:atlas@clickhouse:9000/atlas
  POLL_INTERVAL: 5s
  POLL_INTERVAL_MIN: 1s
  POLL_INTERVAL_MAX: 5s
  INGEST_BATCH_SIZE: "1000"
  INGEST_PAGE_LIMIT: "1000"
  RETENTION_LEDGERS: "17280"
  REORG_WINDOW: "12"
  REORG_RESCAN_INTERVAL: 5m
  SHUTDOWN_TIMEOUT: 10s

services:
  postgres:
    image: postgres:16-alpine
    container_name: naralabs-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: naralabs-clickhouse
    environment:
      CLICKHOUSE_USER: atlas
      CLICKHOUSE_PASSWORD: atlas
      CLICKHOUSE_DB: atlas
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - atlas_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naralabs-atlas-worker
    environment:
      <<: *atlas-env
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naralabs-atlas-server
    environment:
      <<: *atlas-env
      HTTP_ADDR: :8080
      PUBLISH_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 30s
      HTTP_SHUTDOWN_TIMEOUT: 10s
    command: ["server"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: naralabs-atlas-ch-ui
    ports:
      - "3488:3488"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: Atlas ClickHouse
    volumes:
      - atlas_ch_ui_data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas_postgres_data:
  atlas_clickhouse_data:
  atlas_ch_ui_data:
